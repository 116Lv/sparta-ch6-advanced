spring:
  datasource:
    url: jdbc:h2:mem:cafe-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: coffee-order-analytics
      auto-offset-reset: earliest
      enable-auto-commit: false

redisson:
  address: redis://localhost:6379

outbox:
  publisher:
    enabled: false

