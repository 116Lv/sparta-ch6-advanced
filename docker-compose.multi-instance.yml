x-app-common: &app-common
  image: ${CAFE_MULTI_APP_IMAGE:-ch6-cafe-multi:local}
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-environment
    TZ: Asia/Seoul
    SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cafe?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    SPRING_DATASOURCE_USERNAME: cafe
    SPRING_DATASOURCE_PASSWORD: cafe
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PORT: 6379
    REDISSON_ADDRESS: redis://redis:6379
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPRING_KAFKA_CONSUMER_GROUP_ID: coffee-order-analytics
    OUTBOX_PUBLISHER_POLL_MILLIS: 250
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/menus"]
    interval: 3s
    timeout: 5s
    retries: 40

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cafe
      MYSQL_USER: cafe
      MYSQL_PASSWORD: cafe
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
    volumes:
      - mysql-multi-data:/var/lib/mysql

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  app-1:
    <<: *app-common
    environment:
      <<: *app-environment
      OUTBOX_PUBLISHER_OWNER: app-1

  app-2:
    <<: *app-common
    environment:
      <<: *app-environment
      OUTBOX_PUBLISHER_OWNER: app-2

  nginx:
    image: nginx:1.30.3-alpine
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    volumes:
      - ./scripts/e2e/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/menus"]
      interval: 3s
      timeout: 5s
      retries: 40

  k6:
    image: grafana/k6:2.1.0
    profiles:
      - k6
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./scripts/k6/multi-instance.js:/scripts/multi-instance.js:ro
      - ${K6_RESULT_DIR:?K6_RESULT_DIR must be set}:/results
    entrypoint: ["k6", "run", "/scripts/multi-instance.js"]

volumes:
  mysql-multi-data:
