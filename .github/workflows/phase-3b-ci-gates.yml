name: phase-3b-repository-contract

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase-3b-repository-contract:
    name: phase-3b-repository-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install helper dependencies
        run: |
          python -m pip install jsonschema==4.25.1 cryptography==45.0.5
          /usr/bin/python3 -m pip install --break-system-packages jsonschema==4.25.1 cryptography==45.0.5
      - name: Verify helper dependency provenance
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from jsonschema import Draft202012Validator, FormatChecker
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          assert version('jsonschema') == '4.25.1'
          assert version('cryptography') == '45.0.5'
          PY
          /usr/bin/python3 - <<'PY'
          from importlib.metadata import version
          from jsonschema import Draft202012Validator, FormatChecker
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          assert version('jsonschema') == '4.25.1'
          assert version('cryptography') == '45.0.5'
          PY
      - name: Run complete repository contract tests
        shell: bash
        run: |
          set -o pipefail
          bash scripts/ai/tests/run-contract-tests.sh 2>&1 | tee phase3b-contract-test-output.txt
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: phase3b-repository-contract-diagnostics
          path: |
            phase3b-contract-test-output.txt
          if-no-files-found: error
          retention-days: 90
